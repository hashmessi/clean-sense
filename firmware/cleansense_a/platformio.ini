; Optional PlatformIO build for the real CleanSense firmware (same toolchain pins as CleanSense_Servo_Handoff,
; which the servo bench sketch is known to build with). NOT YET BUILT HERE: the PlatformIO registry was
; unreachable from the build session. arduino-cli remains the documented path (INTEGRATION.md 5).
;   cd firmware/cleansense_a ; python -m platformio run ; python -m platformio run -t upload
[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ 3.2.1
    bblanchon/ArduinoJson @ ^6.21.5
